[project]
name = "vynzo-api"
version = "0.1.0"
description = "VYNZO public/backend API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.35",
    "pydantic-settings>=2.10",
    "psycopg[binary,pool]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
