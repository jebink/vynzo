[project]
name = "vynzo-market-ingestion"
version = "0.1.0"
description = "Market-data ingestion: provider adapters for NSE/BSE/vendors, normalized and validated before storage."
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "yfinance==1.8.0",
    "pandas==3.1.1",
    "numpy==2.5.4",
]

[project.scripts]
market-ingestion = "market_ingestion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_ingestion"]
