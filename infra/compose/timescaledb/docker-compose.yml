name: timescaledb  # keep: the existing data volume is "timescaledb_timescaledb_data"
services:
  timescaledb:
    # Pinned (TimescaleDB 2.31.0 / PostgreSQL 16). Upgrade deliberately, after a backup.
    image: timescale/timescaledb:2.31.0-pg16
    container_name: timescaledb
    restart: unless-stopped
    # Schema is managed by dbmate (database/postgres/migrations), not docker-entrypoint-initdb.d.
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: market
      # Only used when the volume is first created. Set in infra/compose/timescaledb/.env (git-ignored).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/timescaledb/.env}
      POSTGRES_DB: market
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - max_locks_per_transaction=256
      - -c
      - max_connections=100
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  timescaledb_data:
