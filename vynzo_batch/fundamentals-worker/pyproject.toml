[project]
name = "vynzo-fundamentals-worker"
version = "0.1.0"
description = "Financial statements and corporate actions ingestion."
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "yfinance==1.8.0",
    "pandas==3.1.1",
    "pydantic-settings>=2.10",
]

[project.scripts]
fundamentals-worker = "fundamentals_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundamentals_worker"]
